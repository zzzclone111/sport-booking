services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sporthub}
      POSTGRES_USER: ${POSTGRES_USER:-sporthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sporthub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sporthub} -d ${POSTGRES_DB:-sporthub}"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build: ./backend
    command: ["node", "src/scripts/migrate.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sporthub}:${POSTGRES_PASSWORD:-sporthub}@postgres:5432/${POSTGRES_DB:-sporthub}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build: ./backend
    command: ["node", "src/scripts/seed.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sporthub}:${POSTGRES_PASSWORD:-sporthub}@postgres:5432/${POSTGRES_DB:-sporthub}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-sporthub}:${POSTGRES_PASSWORD:-sporthub}@postgres:5432/${POSTGRES_DB:-sporthub}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
