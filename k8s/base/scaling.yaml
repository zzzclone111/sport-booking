apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: backend, namespace: sporthub }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: backend }
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: frontend, namespace: sporthub }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: frontend }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 75 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: backend, namespace: sporthub }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: backend } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: frontend, namespace: sporthub }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: frontend } }
