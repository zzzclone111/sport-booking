apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: sporthub
  labels: { app: frontend, app.kubernetes.io/part-of: sporthub }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend, app.kubernetes.io/part-of: sporthub } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      imagePullSecrets:
        - name: cmc-registry
      containers:
        - name: frontend
          image: zzzdocker1/sporthub-frontend:1.1.5
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: nginx-tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 192Mi }
      volumes:
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: sporthub
spec:
  selector: { app: frontend }
  ports:
    - { name: http, port: 8080, targetPort: http }
