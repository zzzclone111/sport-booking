apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: sporthub
  labels: { app: backend, app.kubernetes.io/part-of: sporthub }
spec:
  replicas: 2
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend, app.kubernetes.io/part-of: sporthub } }
    spec:
      imagePullSecrets:
        - name: cmc-registry
      initContainers:
        - name: migrate
          image: zzzdocker1/sporthub-backend:1.1.5
          command: ["node", "src/scripts/migrate.js"]
          envFrom:
            - configMapRef: { name: sporthub-config }
            - secretRef: { name: sporthub-secrets }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
      containers:
        - name: backend
          image: zzzdocker1/sporthub-backend:1.1.5
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef: { name: sporthub-config }
            - secretRef: { name: sporthub-secrets }
            - secretRef: { name: sporthub-s3 }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 150m, memory: 192Mi }
            limits: { cpu: 800m, memory: 512Mi }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: { matchLabels: { app: backend } }
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: sporthub
spec:
  selector: { app: backend }
  ports:
    - { name: http, port: 3000, targetPort: http }
