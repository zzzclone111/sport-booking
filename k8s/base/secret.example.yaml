apiVersion: v1
kind: Secret
metadata:
  name: sporthub-secrets
  namespace: sporthub
type: Opaque
stringData:
  # Use the private CMC RDS endpoint reachable from the same VPC.
  DATABASE_URL: postgresql://sporthub:CHANGE_ME@10.0.0.10:5432/sporthub
  JWT_SECRET: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
  # Optional: leave empty when Redis is not provisioned.
  REDIS_URL: ""
