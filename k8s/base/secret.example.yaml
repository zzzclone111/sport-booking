apiVersion: v1
kind: Secret
metadata:
  name: sporthub-secrets
  namespace: sporthub
type: Opaque
stringData:
  # Use the private CMC RDS endpoint reachable from the same VPC.
  DATABASE_URL: postgresql://sporthub:CHANGE_ME@CHANGE_ME:5432/sporthub
  JWT_SECRET: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
  # Optional: leave empty when Redis is not provisioned.
  REDIS_URL: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: sporthub-s3
  namespace: sporthub
type: Opaque
stringData:
  S3_ACCESS_KEY_ID:
  S3_BUCKET:
  S3_ENDPOINT:
  S3_REGION:
  S3_SECRET_ACCESS_KEY: